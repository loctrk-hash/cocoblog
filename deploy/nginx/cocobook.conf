# cocobook.cc — Hugo 部落格（根目錄）＋ LINE Bot App 保留路徑
# 由 Phase C 產生。回滾：還原 /etc/nginx/sites-available/cocobook 備份後 reload。

server {
    listen 80;
    server_name cocobook.cc www.cocobook.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    return 301 https://cocobook.cc$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cocobook.cc www.cocobook.cc;

    ssl_certificate     /etc/letsencrypt/live/cocobook.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cocobook.cc/privkey.pem;

    root /var/www/cocobook;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 部落格（Hugo 靜態檔）
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # 靜態資源快取
    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
    }

    # --- LINE Bot App：保留，不刪 ---

    # LINE webhook
    location = /webhook {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Line-Signature $http_x_line_signature;
    }

    # App 靜態檔（既有 alias，原封不動）
    location ^~ /static/coco_cs/ {
        alias /home/darius/linebot/publicWeb_cococs/;
        expires 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /static/sales/ {
        alias /home/darius/linebot/publicWeb_sales/;
        expires 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /static/qrcode/ {
        alias /home/darius/linebot/publicWeb_sales/qrcode/;
        expires 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /static/sales {
        return 301 /static/sales/;
    }

    location = /static/qrcode {
        return 301 /static/qrcode/;
    }

    location /static/ {
        alias /home/darius/linebot/publicWeb/;
        expires 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
