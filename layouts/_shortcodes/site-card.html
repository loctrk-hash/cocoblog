{{- $url := .Get "url" -}}
{{- $title := .Get "title" | default "前往網站" -}}
{{- $desc := .Get "desc" -}}
<a class="site-card" href="{{ $url }}" target="_blank" rel="noopener noreferrer">
  <span class="site-card-icon" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
      <line x1="1" y1="10" x2="23" y2="10"></line>
    </svg>
  </span>
  <span class="site-card-body">
    <span class="site-card-title">{{ $title }}</span>
    {{- with $desc }}<span class="site-card-desc">{{ . }}</span>{{ end }}
  </span>
  <span class="site-card-cta">前往 <span aria-hidden="true">→</span></span>
</a>
